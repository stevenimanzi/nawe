name: Android APK

# Builds an installable debug APK of the frontend wrapped with Capacitor.
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
# to the public origin of the Laravel API, e.g. https://api.example.com  (no trailing slash, no /api).

on:
    workflow_dispatch:
    push:
        branches: [mobile-app]

jobs:
    apk:
        name: Build debug APK
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Install dependencies
              working-directory: frontend
              run: |
                  npm ci
                  npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

            - name: Build web app
              working-directory: frontend
              env:
                  VITE_API_URL: ${{ vars.API_URL }}
              run: npm run build

            - name: Add Android platform and sync
              working-directory: frontend
              run: |
                  npx cap add android
                  npx cap sync android

            - name: Build APK
              working-directory: frontend/android
              run: ./gradlew assembleDebug

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: nawe-debug-apk
                  path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
