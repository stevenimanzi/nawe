name: Frontend CI

on:
    pull_request:
        branches: [main]
        paths:
            - 'frontend/**'
    push:
        branches: [main]
        paths:
            - 'frontend/**'

jobs:
    typecheck:
        name: TypeScript — Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Type check
              run: npx tsc --noEmit
              working-directory: frontend

    build:
        name: Vite — Production Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Build
              run: npm run build
              working-directory: frontend
