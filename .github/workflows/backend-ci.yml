name: Backend CI

on:
    pull_request:
        branches: [main]
        paths:
            - 'backend/**'
    push:
        branches: [main]
        paths:
            - 'backend/**'

jobs:
    test:
        name: PHP ${{ matrix.php }} — Tests
        runs-on: ubuntu-latest

        strategy:
            matrix:
                php: ['8.4']

        services:
            mysql:
                image: mysql:9.0
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: nawe_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, pdo, pdo_mysql, redis
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress
              working-directory: backend

            - name: Copy env
              run: cp .env.example .env.testing
              working-directory: backend

            - name: Generate key
              run: php artisan key:generate --env=testing
              working-directory: backend

            - name: Run migrations
              run: php artisan migrate --env=testing --force
              working-directory: backend
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: nawe_test
                  DB_USERNAME: root
                  DB_PASSWORD: password

            - name: Run tests
              run: php artisan test --parallel
              working-directory: backend
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: nawe_test
                  DB_USERNAME: root
                  DB_PASSWORD: password

    lint:
        name: PHP Lint (Pint)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress
              working-directory: backend

            - name: Run Pint
              run: ./vendor/bin/pint --test
              working-directory: backend
